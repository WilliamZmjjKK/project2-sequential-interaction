<title>Winter Light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500&display=swap">
<style>
/* Layout: one full-bleed touch stage (phone), or a phone-sized stage centred on a dark page (wide screens).
   Three chapters share one canvas; the title cards and captions sit above it. Single committed night look. */
:root {
  color-scheme: dark;
  --page: #080b14;
  --night: #0f1730;
  --ink: #f6f2ea;
  --ink-soft: rgba(246, 242, 234, .66);
  --veil: rgba(12, 16, 28, .55);
  --line: rgba(246, 242, 234, .15);
  --gold: #ffc46e;
  --font: "Avenir Next", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --title: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", Georgia, serif;
}
html, body { height: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  display: grid;
  place-items: center;
  overflow: hidden;
  overscroll-behavior: none;
}
#stage {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--night);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
@media (min-width: 560px) {
  #stage {
    width: min(430px, calc(100% - 32px));
    height: min(900px, calc(100% - 32px));
    border-radius: 30px;
    box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0, 0, 0, .55);
  }
}
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.cap {
  position: absolute;
  left: 50%;
  top: 16px;
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100% - 32px);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 20px 11px 16px;
  border-radius: 999px;
  background: rgba(12, 16, 28, .62);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: inset 0 0 0 1px rgba(255, 214, 150, .38), 0 0 24px rgba(255, 190, 110, .22), 0 6px 20px rgba(0, 0, 0, .35);
  color: var(--ink);
  font-size: 15px;
  font-weight: 500;
  line-height: 1.3;
  letter-spacing: .04em;
  text-shadow: 0 0 12px rgba(255, 214, 150, .45);
  font-variant-numeric: tabular-nums;
  text-wrap: balance;
  pointer-events: none;
  transition: opacity .8s ease;
  animation: capGlow 3.2s ease-in-out infinite;
}
.cap.gone { opacity: 0; animation: none; }
#capText { display: inline-block; }
#capText.pop { animation: capIn .6s cubic-bezier(.2, .8, .2, 1); }
@keyframes capGlow { 50% { box-shadow: inset 0 0 0 1px rgba(255, 214, 150, .62), 0 0 34px rgba(255, 190, 110, .42), 0 6px 20px rgba(0, 0, 0, .35); } }
@keyframes capIn { from { opacity: 0; transform: translateY(-6px); filter: blur(3px); } }
.steps { display: flex; gap: 9px; flex: none; }
.steps b { display: flex; gap: 3px; }
.steps i {
  width: 6px; height: 6px; border-radius: 50%;
  box-shadow: inset 0 0 0 1px var(--ink-soft);
  transition: background .5s ease, box-shadow .5s ease;
}
.steps i.on { background: var(--ink); box-shadow: none; }
.steps i.done { background: var(--gold); box-shadow: none; }

#card {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  background: radial-gradient(closest-side, rgba(8, 11, 20, .62), rgba(8, 11, 20, 0));
  transition: opacity 1.4s ease;
  cursor: pointer;
}
#card.gone { opacity: 0; pointer-events: none; }
.card-in { display: grid; justify-items: center; gap: 12px; padding-inline: 16px; }
.t-en { font-family: var(--title); font-weight: 300; font-size: clamp(42px, 12.5vw, 60px); line-height: 1.05; letter-spacing: .03em; text-wrap: balance; }
.t-cn { font-family: var(--title); font-weight: 500; font-size: 14px; letter-spacing: .6em; margin-right: -.6em; }
.t-sub { font-size: 12.5px; letter-spacing: .24em; color: var(--ink-soft); }
.t-go { margin-top: 30px; font-size: 12.5px; letter-spacing: .16em; color: var(--ink-soft); animation: breathe 2.8s ease-in-out infinite; }
#again {
  margin-top: 30px;
  padding: 11px 22px;
  border: 0; border-radius: 999px;
  background: var(--veil);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink);
  font: inherit; font-size: 12.5px; letter-spacing: .14em;
  cursor: pointer;
}
#again:focus-visible, #skip:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
#skip {
  position: absolute;
  bottom: 18px; right: 16px;
  height: 34px; padding: 0 14px;
  border: 0; border-radius: 999px;
  background: var(--veil);
  box-shadow: inset 0 0 0 1px var(--line);
  color: var(--ink-soft);
  font: inherit; font-size: 11.5px; letter-spacing: .12em;
  cursor: pointer;
}
@keyframes breathe { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .t-go, .cap, #capText.pop { animation: none; } .cap, #card, .steps i { transition: none; } }
</style>

<div id="stage">
  <canvas id="cv" role="img" aria-label="Winter Light, a three-chapter touch story. Pull a curtain of feathers open, blow the snow off a campfire, then draw five frost feathers across a window. Each chapter ends when you play the same five-note melody."></canvas>
  <div class="cap gone" id="cap">
    <span class="steps" aria-hidden="true"><b><i></i><i></i></b><b><i></i><i></i></b><b><i></i><i></i></b></span>
    <span id="capText"></span>
  </div>
  <button id="skip" type="button" aria-label="Skip to the next step" hidden>Skip ›</button>
  <div id="card" role="button" tabindex="0" aria-label="Begin">
    <div class="card-in">
      <div class="t-en">Winter Light</div>
      <div class="t-cn">冬光</div>
      <div class="t-sub" id="tSub">Feather · Snow · Frost</div>
      <div class="t-go" id="tGo">Touch to begin</div>
      <button id="again" type="button" hidden>Play again</button>
    </div>
  </div>
</div>

      const a = state === 'finale' ? .9 : .5 + .15 * Math.sin(t * 2.2 + f.k);
      blit(SPR.gold, f.tip[0], f.tip[1], 34 * K * (1 + .3 * f.bright), a); blit(SPR.white, f.tip[0], f.tip[1], 9 * K, Math.min(1, a + .2));
    }
    // touch hint: a bright edge along the grown spine, and light running on toward the tip
    if (state === 'grow' && (down || now < hintHold) && near >= 0 && !ferns[near].rev) {
      const f = ferns[near], sp = f.F.polys[0], T = f.g * f.F.L;
      ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sp.pts[0], sp.pts[1]);
      for (let i = 1; i < sp.d.length && sp.d[i] <= T; i++) ctx.lineTo(sp.pts[2 * i], sp.pts[2 * i + 1]);
      ctx.strokeStyle = 'rgba(200,220,255,.18)'; ctx.lineWidth = 7 * K; ctx.stroke();
      ctx.strokeStyle = 'rgba(240,246,255,.5)'; ctx.lineWidth = 1.6 * K; ctx.stroke();
      const flow = (t * .8) % 1;
      for (let n = 0; n < 7; n++) {
        const u = (n + flow) / 7, [x, y] = pointAt(f.F, T + (f.F.L - T) * u);
        blit(SPR.white, x, y, 5 * K, Math.sin(u * Math.PI) * .8);
      }
      blit(SPR.gold, f.tip[0], f.tip[1], 22 * K, .18 + .12 * Math.sin(t * 4));
      ctx.restore();
      if (down) { ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(244,246,249,.3)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(fx, fy, 26 * K, 0, TAU); ctx.stroke(); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.life += dt;
      if (p.life >= p.max) { sparks.splice(i, 1); continue; }
      p.vx *= Math.exp(-dt * 2); p.vy = p.vy * Math.exp(-dt * 2) - 8 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      blit(p.warm ? SPR.gold : SPR.white, p.x, p.y, (p.warm ? 5 : 2.4) * K, Math.sin(p.life / p.max * Math.PI) * .9);
    }
    // a golden feather drifts down through the cleared window and touches the frost
    if (state === 'finale') {
      const u = clamp((tf - 4.6) / 3, 0, 1);
      if (tf > 4.6) {
        const e = 1 - (1 - u) ** 2, ly = C[1] + R * .32;
        const x = C[0] + Math.sin(u * 7) * 26 * K * (1 - u), y = C[1] - R - 80 * K + (ly - (C[1] - R - 80 * K)) * e;
        goldFeather(x, y, Math.sin(u * 6) * .5 * (1 - u) + .25, .6 * K, 1);
        blit(SPR.gold, x, y, 40 * K, .3);
        if (u >= 1) {
          for (const off of [0, .5]) {
            const ur = ((tf - 7.6) / 2.2 + off) % 1;
            ctx.globalAlpha = 1; ctx.lineWidth = 1.2; ctx.strokeStyle = `rgba(255,214,150,${(1 - ur) * .6})`;
            ctx.beginPath(); ctx.ellipse(C[0], ly + 26 * K, 14 * K + ur * 90 * K, 4 * K + ur * 20 * K, 0, 0, TAU); ctx.stroke();
          }
        }
      }
      if (tf > 8.6 && !ended) { ended = true; director.end(); }
    }
    ctx.globalAlpha = 1;

    if (quiet) return;
    swish *= Math.exp(-dt * 8);
    bus(swish * .05, 3600, 0, 0);
    if (state === 'grow') say(touched ? `Trace a frost feather inward · ${revealed}/5` : 'Touch the frost');
    else if (state === 'echo') say(echo ? echoCaption(echo, 'Touch the notes in order') : 'Listen…');
    else say('');
  }
  return { enter, layout, frame, down: pdown, move: pmove, up: pup, skip,
    probe: () => echo ? { state: echo.state, idx: echo.idx, pts: echo.marks.map(m => m.pos()) } : null, st: () => state,
    dbg: () => ferns.map(f => [+f.g.toFixed(3), +f.goal.toFixed(3), f.rev, f.F.L | 0]),
    fernPaths: () => ferns.map(f => { const sp = f.F.polys[0], out = []; for (let i = 0; i < sp.d.length; i += 3) out.push([sp.pts[2 * i], sp.pts[2 * i + 1]]); out.push([f.tip[0], f.tip[1]]); return out; }) };
}

/* =====================================================================
   director: opening card → I → II → III → closing card
   ===================================================================== */
const card = document.getElementById('card');
const tGo = document.getElementById('tGo');
const tSub = document.getElementById('tSub');
const again = document.getElementById('again');
const skipBtn = document.getElementById('skip');
const TRANS = 2600;
let started = false, finished = false, cur = 0, prev = null, transT = 0, pid = null, last = performance.now();
const director = {
  next(hand) { prev = chapters[cur]; cur = Math.min(cur + 1, chapters.length - 1); transT = performance.now(); chapters[cur].enter(hand); },
  end() {
    finished = true; skipBtn.hidden = true; cap.classList.add('gone');
    tSub.textContent = 'Feather · Snow · Frost'; tGo.hidden = true; again.hidden = false;
    card.classList.remove('gone'); card.setAttribute('aria-label', 'Winter Light');
  }
};
const chapters = [Feather(director), Snow(director), Frost(director)];

function layout() {
  const r = stage.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  W = r.width; H = r.height; dpr = Math.min(window.devicePixelRatio || 1, 2); K = clamp(W / 390, .8, 1.4);
  cv.width = off.width = Math.round(W * dpr); cv.height = off.height = Math.round(H * dpr);
  buildGrain();
  chapters[cur].layout();
  if (prev) prev.layout();
}
function begin() {
  audio();
  started = true; finished = false; cur = 0; prev = null;
  card.classList.add('gone'); cap.classList.remove('gone'); skipBtn.hidden = false;
  chapters[0].enter();
}
card.addEventListener('pointerdown', ev => { if (!started) { ev.preventDefault(); begin(); } });
card.addEventListener('keydown', ev => { if (!started && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); begin(); } });
again.addEventListener('click', ev => {
  ev.stopPropagation(); audio();
  tSub.textContent = 'Feather · Snow · Frost'; tGo.hidden = false; again.hidden = true;
  begin();
});
skipBtn.addEventListener('click', () => { audio(); if (!prev) chapters[cur].skip(); });

function local(ev) { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
cv.addEventListener('pointerdown', ev => {
  if (!started || pid !== null) return;
  audio(); pid = ev.pointerId;
  try { cv.setPointerCapture(pid); } catch (err) {}
  if (!prev) chapters[cur].down(...local(ev));
  ev.preventDefault();
});
cv.addEventListener('pointermove', ev => { if (ev.pointerId === pid && !prev) chapters[cur].move(...local(ev)); });
const release = ev => { if (ev.pointerId !== pid) return; pid = null; audio(); chapters[cur].up(); if (prev) prev.up(); };
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', ev => ev.preventDefault());

function frame(now) {
  requestAnimationFrame(frame);
  if (!W) return;
  const t = now / 1000, dt = Math.min(.05, Math.max(.001, (now - last) / 1000));
  last = now;
  ctx = mainCtx;
  if (!started) {                                     // the opening card sits over a slowly breathing first scene
    chapters[0].frame(t, dt, now, true);
    return;
  }
  chapters[cur].frame(t, dt, now, false);
  if (prev) {
    const u = (now - transT) / TRANS;
    if (u >= 1) prev = null;
    else {
      ctx = offCtx;
      offCtx.setTransform(1, 0, 0, 1, 0, 0); offCtx.globalAlpha = 1; offCtx.globalCompositeOperation = 'source-over';
      offCtx.clearRect(0, 0, off.width, off.height);
      prev.frame(t, dt, now, true);
      ctx = mainCtx;
      mainCtx.setTransform(1, 0, 0, 1, 0, 0); mainCtx.globalCompositeOperation = 'source-over';
      mainCtx.globalAlpha = 1 - smooth(clamp(u, 0, 1));
      mainCtx.drawImage(off, 0, 0);
      mainCtx.globalAlpha = 1;
    }
  }
}

layout();
chapters[0].enter();
steps(0, 0);
if ('ResizeObserver' in window) new ResizeObserver(layout).observe(stage);
else addEventListener('resize', layout);
requestAnimationFrame(frame);
if (location.hash === '#debug') window.__wl = { chapters, director, get cur() { return cur; }, get prev() { return prev; } };
})();
</script>
